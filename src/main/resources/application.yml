server:
  port: ${SERVER_PORT:8080}

ecommerce:
  app:
    # Required. Supply at least 32 random bytes, preferably Base64 encoded.
    jwtSecret: ${JWT_SECRET}
    jwtExpirationMs: ${JWT_EXPIRATION_MS:86400000}
  payment:
    bank-id: ${PAYMENT_BANK_ID}
    bank-name: ${PAYMENT_BANK_NAME}
    account-number: ${PAYMENT_ACCOUNT_NUMBER}
    account-name: ${PAYMENT_ACCOUNT_NAME}
    qr-template: ${PAYMENT_QR_TEMPLATE:compact2}
    viet-qr-image-base-url: ${VIETQR_IMAGE_BASE_URL:https://img.vietqr.io/image}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN:1}
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        '[format_sql]': true
        default_batch_fetch_size: 50
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
